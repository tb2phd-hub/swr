<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Space Weather Research</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap');

        :root {
            --ink: #17252d;
            --muted: #52636b;
            --accent: #d45d2c;
            --teal: #147f82;
            --paper: #fffaf0;
        }

        * { box-sizing: border-box; }

        body {
            align-items: center;
            background: #f2eee4;
            background-image: radial-gradient(circle at 12% 10%, rgba(240, 164, 91, 0.35), transparent 24rem), radial-gradient(circle at 90% 85%, rgba(20, 127, 130, 0.2), transparent 26rem);
            color: var(--ink);
            display: flex;
            font-family: 'DM Sans', sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        .section {
            background: rgba(255, 250, 240, 0.9);
            border-top: 5px solid var(--accent);
            box-shadow: 0 18px 40px rgba(23, 37, 45, 0.12);
            max-width: 640px;
            padding: clamp(28px, 6vw, 54px);
            width: 100%;
        }

        h2 {
            color: var(--teal);
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2rem, 6vw, 3.4rem);
            letter-spacing: -0.03em;
            margin: 0 0 26px;
        }

        form { display: grid; gap: 14px; }

        input, textarea {
            background: #f6f1e7;
            border: 1px solid rgba(23, 37, 45, 0.16);
            border-radius: 2px;
            color: var(--ink);
            font: inherit;
            padding: 14px 16px;
            width: 100%;
        }

        textarea { min-height: 160px; resize: vertical; }

        input:focus, textarea:focus {
            border-color: var(--teal);
            outline: 3px solid rgba(20, 127, 130, 0.16);
        }

        .btn {
            background: var(--teal);
            border: 0;
            border-radius: 2px;
            color: white;
            cursor: pointer;
            font: 700 0.95rem 'DM Sans', sans-serif;
            padding: 14px 20px;
            transition: background 160ms ease, transform 160ms ease;
        }

        .btn:hover { background: var(--accent); transform: translateY(-2px); }
    </style>
</head>

<body>
    <section id="contact" class="section">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>
</body>

</html>
